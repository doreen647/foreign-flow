name: daily-foreign-report

on:
  schedule:
    - cron: "30 0,2,4,6,9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python build_report.py
      - name: Commit results
        run: |
          git config user.name "report-bot"
          git config user.email "report-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || (git commit -m "daily update" && git push)
